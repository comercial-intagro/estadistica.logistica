// DIAGNÓSTICO 3b: lee quota_alfanumericos + buyer_quotas para comparar el cruce de
// SIN CTG contra la fuente actual (JSONP). Devuelve un mapa por alfanumérico normalizado.
async function cargarAlfasSupabase() {
  const pageSize = 1000;
  const leerTodo = async (tabla, cols) => {
    let desde = 0, acc = [];
    for (;;) {
      const { data, error } = await sb.from(tabla).select(cols).range(desde, desde + pageSize - 1);
      if (error) throw error;
      acc = acc.concat(data || []);
      if (!data || data.length < pageSize) break;
      desde += pageSize;
    }
    return acc;
  };
  const alfas = await leerTodo('quota_alfanumericos', 'code,buyer_quota_id,status');
  const quotas = await leerTodo('buyer_quotas', 'id,comprador,destinatario,destino,producto,rte_comercial_primaria,rte_comercial_secundaria');
  const qById = {}; quotas.forEach(q => { qById[q.id] = q; });
  const map = {};
  alfas.forEach(a => { const k = normClave(a.code); if (k && !map[k]) map[k] = { code: a.code, status: a.status, quota: qById[a.buyer_quota_id] || null }; });
  return { map, totalAlfas: alfas.length, totalQuotas: quotas.length };
}

const normClave = (s) => (s || '').toString().trim().toUpperCase().replace(/\s+/g, '');
const normTexto = (s) => (s || '').toString().trim().toUpperCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .replace(/[^A-Z0-9]/g, '');

// Convierte el nombre abreviado de Logística al nombre canónico usado en el ABM.
// Ej.: "Ger Valverdi" -> "GERMAN VALVERDI"; "Diego Abello" -> "ABELLO DIEGO GASTON".
const resolverRepreABM = (nombreLogistica, nombresAbm) => {
  const raw = (nombreLogistica || '').toString().trim();
  if (!raw) return '';
  const objetivo = normTexto(raw);
  if (!objetivo) return raw;

  // 1) Coincidencia exacta normalizada.
  const exacto = nombresAbm.find(n => normTexto(n) === objetivo);
  if (exacto) return exacto;

  const palabrasLog = raw.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toUpperCase().replace(/[^A-Z0-9 ]/g, ' ').split(/\s+/).filter(Boolean);
  if (!palabrasLog.length) return raw;

  // 2) Apellido + nombre/prefijo, sin importar el orden.
  const candidatos = nombresAbm.map(n => {
    const palabrasAbm = n.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .toUpperCase().replace(/[^A-Z0-9 ]/g, ' ').split(/\s+/).filter(Boolean);
    let score = 0;
    palabrasLog.forEach(p => {
      const match = palabrasAbm.some(a => a === p || (p.length >= 3 && a.startsWith(p)) || (a.length >= 3 && p.startsWith(a)));
      if (match) score++;
    });
    return { nombre:n, score, total:palabrasLog.length };
  }).filter(x => x.score > 0)
    .sort((a,b) => b.score-a.score || a.nombre.localeCompare(b.nombre));

  if (candidatos.length && candidatos[0].score === candidatos[0].total &&
      (!candidatos[1] || candidatos[1].score < candidatos[0].score)) {
    return candidatos[0].nombre;
  }

  // Si no hay equivalencia inequívoca, conservamos el texto de Logística.
  return raw;
};

// JSONP evita los problemas CORS al abrir esta herramienta directamente como archivo local.
function cargarLogisticaJSONP() {
  return new Promise((resolve, reject) => {
    const cb = '__logistica_cb_' + Date.now() + '_' + Math.floor(Math.random()*100000);
    const script = document.createElement('script');
    const timer = setTimeout(() => limpiar(new Error('Tiempo de espera agotado al consultar Logística.')), 60000);
    const limpiar = (err, data) => {
      clearTimeout(timer);
      try { delete window[cb]; } catch(e) { window[cb] = undefined; }
      if (script.parentNode) script.parentNode.removeChild(script);
      err ? reject(err) : resolve(data);
    };
    window[cb] = (data) => limpiar(null, data);
    script.onerror = () => limpiar(new Error('No se pudo conectar con la API de Logística.'));
    script.src = LOGISTICA_API + '?callback=' + encodeURIComponent(cb) + '&_=' + Date.now();
    document.head.appendChild(script);
  });
}

const extraerCuit = (s) => {

};

// "01/09/2026 19:00 - 20:00" -> "2026-09-01" (ISO para ordenar/comparar)
const parseFecha = (s) => {
  if (!s) return null;
  const str = s.toString().trim();
  // ISO: 2026-10-01 (con o sin hora)
  const iso = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (iso) return `${iso[1]}-${iso[2]}-${iso[3]}`;
  // dd/mm/yyyy
  const m = str.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
  if (m) return `${m[3]}-${m[2]}-${m[1]}`;
  // por si viene como Date
  if (s instanceof Date && !isNaN(s)) return s.toISOString().slice(0,10);
  return null;
};

// ==================== PARSEO DEL EXCEL ====================
function parseExcel(arrayBuffer) {
  const wb = XLSX.read(arrayBuffer, { type: 'array' });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
  // Buscar fila de encabezados (contiene 'Id Turno Terminal')
  let hIdx = -1;
  for (let i = 0; i < Math.min(rows.length, 15); i++) {
    if (rows[i].some(c => (c||'').toString().trim() === 'Id Turno Terminal')) { hIdx = i; break; }
  }
  if (hIdx === -1) throw new Error("No se encontró la columna 'Id Turno Terminal'. ¿Es el Excel del STOP?");
  const headers = rows[hIdx].map(h => (h||'').toString().trim());
  const col = (name) => headers.indexOf(name);
  const idx = {
    estado: col('Estado'), id: col('Id Turno Terminal'), fecha: col('Fecha'),
    grano: col('Grano'), destino: col('Destino'), destinatario: col('Destinatario'),
    ctg: col('CTG'), origen: col('Origen'), contrato: col('N° Contrato'),
    intermediario: col('Intermediario'), rttecom: col('Rtte. Comercial'),
    localidadDestino: col('Localidad Destino')
  };
  const registros = [];
  for (let i = hIdx + 1; i < rows.length; i++) {
    const r = rows[i];
    const id = (r[idx.id]||'').toString().trim();
    if (!id) continue;
    registros.push({
      id,
      estado: (r[idx.estado]||'').toString().trim(),
      fecha: parseFecha(r[idx.fecha]),
      producto: limpiarProducto(r[idx.grano]),
      destino: limpiarCuit(r[idx.destino]),
      localidadDestino: (r[idx.localidadDestino]||'').toString().trim(),
      comprador: limpiarCuit(r[idx.destinatario]),
      ctg: (r[idx.ctg]||'').toString().trim(),
      origen: limpiarCuit(r[idx.origen]),
      origenCuit: extraerCuit(r[idx.origen]),
      intermediario: limpiarCuit(r[idx.intermediario]),
      intermediarioCuit: extraerCuit(r[idx.intermediario]),
      rtteComercial: limpiarCuit(r[idx.rttecom]),
      rtteComercialCuit: extraerCuit(r[idx.rttecom]),
      contrato: (r[idx.contrato]||'').toString().trim(),
    });
  }
  return registros;
}

// Upsert en lotes de 50 con pausa entre cada uno.
// ANTES del upsert, marca como inactivos los turnos del rango de fechas
// que ya no aparecen en el nuevo Excel (punto violeta).
async function upsertTurnosSupabase(registros, onProgreso) {
  const rows = registros.map(turnoToRow);
  const ids = new Set(rows.map(r => r.id_turno_terminal));

  // Determinar rango de fechas del import
  const fechas = rows.map(r => r.fecha).filter(Boolean).sort();
  const minFecha = fechas[0], maxFecha = fechas[fechas.length - 1];

  if (minFecha && maxFecha) {
    // Leer los alfanuméricos existentes en ese rango
    const pageSize = 1000;
    let desde = 0, existentes = [];
    for (;;) {
      const { data, error } = await sb.from('turnos_stop')
        .select('id_turno_terminal')
        .gte('fecha', minFecha).lte('fecha', maxFecha)
        .range(desde, desde + pageSize - 1);
      if (error) throw error;
      existentes = existentes.concat(data || []);
      if (!data || data.length < pageSize) break;
      desde += pageSize;
    }
    // Los que están en el rango pero NO vienen en el nuevo Excel → inactivos
    const aDesactivar = existentes
      .map(r => r.id_turno_terminal)
      .filter(id => !ids.has(id));
    for (let i = 0; i < aDesactivar.length; i += 200) {
      const lote = aDesactivar.slice(i, i + 200);
      const { error } = await sb.from('turnos_stop')
        .update({ activo_en_stop: false })
        .in('id_turno_terminal', lote);
      if (error) throw error;
    }
  }

  // Upsert los nuevos (todos con activo_en_stop = true)
  const batchSize = 50;
  let enviados = 0;
  for (let i = 0; i < rows.length; i += batchSize) {
    const lote = rows.slice(i, i + batchSize);
    const { error } = await sb.from('turnos_stop')
      .upsert(lote, { onConflict: 'id_turno_terminal' });
    if (error) throw error;
    enviados += lote.length;
    if (onProgreso) onProgreso(enviados, rows.length);
    if (i + batchSize < rows.length) await new Promise(r => setTimeout(r, 300));
  }
}

        const TolerantSelect = ({ value, onChange, options, className, placeholder = 'Seleccionar...' }) => {
            const opts = useMemo(() => {
                const base = (options || []).filter(Boolean);
                const v = (value || '').toString();
                if (v && !base.some(o => o === v)) return [v, ...base];
                return base;
            }, [options, value]);
            return (
                <select className={className} value={value || ''} onChange={onChange}>
                    <option value="">{placeholder}</option>

        function ManageAlfaModal({ batch, onClose, onSave }) {
             const [localAlfas, setLocalAlfas] = useState([...batch.alfanumericos.map(a => typeof a === 'string' ? {code: a, status: 'disponible'} : a)]);
             const [selected, setSelected] = useState([]);
             const [searchTerm, setSearchTerm] = useState('');

             const filteredAlfas = useMemo(() => {
                 if (!searchTerm) return localAlfas;
                 return localAlfas.filter(a => a.code.toLowerCase().includes(searchTerm.toLowerCase()));
             }, [localAlfas, searchTerm]);

             const toggleAll = (e) => {
                 if (e.target.checked) {
                     const filteredCodes = filteredAlfas.map(a => a.code);
                     setSelected(Array.from(new Set([...selected, ...filteredCodes])));
                 } else {
                     const filteredCodes = filteredAlfas.map(a => a.code);
                     setSelected(selected.filter(code => !filteredCodes.includes(code)));
                 }
             };

             const toggleOne = (code) => setSelected(prev => prev.includes(code) ? prev.filter(c => c !== code) : [...prev, code]);

             const applyStatus = (newStatus) => {
                 if (selected.length === 0) return;
                 setLocalAlfas(prev => prev.map(a => selected.includes(a.code) ? { ...a, status: newStatus } : a));
                 setSelected([]);
             };

             const allFilteredSelected = filteredAlfas.length > 0 && filteredAlfas.every(a => selected.includes(a.code));

             return (
                 <div className="fixed inset-0 z-[80] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">

                                        <th className="p-2 font-bold text-slate-600 text-xs uppercase tracking-wider text-center">Estado Actual</th>

        function AddCuposModal({ onClose, onSave, templates, saveTemplate, editData, destinos = [], intervinientes = [], templateMode = false }) {

                if (editData && editData.fullCpData) {
                    setForm(editData.fullCpData);

                    setAlfanumericos(alfaStr);
                    if (editData._templateName) setTemplateName(editData._templateName);
                }
            }, [editData]);

            const parsedCodes = useMemo(() => {
                return alfanumericos.split(/[\s,]+/).map(s => s.trim().toUpperCase()).filter(s => s.length > 0);
            }, [alfanumericos]);

            const handleChange = (field, val) => setForm(prev => ({...prev, [field]: val}));

            const handleLoadTemplate = (e) => {
                const tName = e.target.value;
                if (!tName) return;
                const tmpl = templates.find(t => t.name === tName);
                if (tmpl) setForm(tmpl.data);
            };

            const handleSaveTemplate = async () => {
                if (!templateName.trim()) return alert("Ingresa un nombre para la plantilla.");
                if (saveTemplate) {
                    await saveTemplate(templateName, form);
                    alert("Plantilla guardada con éxito.");
                }
                setTemplateName('');
            };

            const handleSaveBatch = () => {
                if (parsedCodes.length === 0) return alert("Debes ingresar al menos 1 código alfanumérico. Utiliza el botón 'Pegar Alfanuméricos'.");
                if (parsedCodes.length > 300) return alert("El máximo permitido es 300 códigos por lote.");
                if (!form.fechaCupo) return alert("La Fecha del cupo es obligatoria.");
                if (!form.producto || !form.comprador) return alert("Producto y Comprador son obligatorios.");

                onSave({
                    ...form,
                    alfanumericosList: parsedCodes
                });

            // Opciones de intervinientes desde el ABM (fallback a MOCK si está vacío)
            const intervOpts = useMemo(() => {
                const fromAbm = (intervinientes || []).map(i => i.descripcion).filter(Boolean);
                return fromAbm.length > 0 ? fromAbm : MOCK_OPTIONS.empresas;
            }, [intervinientes]);

            // Destinos filtrados por el producto elegido en la CP
            const destinosFiltrados = useMemo(() => {
                if (!form.producto) return [];
                const prod = (form.producto || '').toUpperCase();
                return (destinos || []).filter(d => {
                    const dp = (d.producto || '').toUpperCase();
                    return dp === prod || dp === 'TODOS';
                });
            }, [destinos, form.producto]);

            // Al elegir un destino, autocompletar los datos asociados
            const selectDestino = (descripcion) => {
                if (!descripcion) { handleChange('destino', ''); return; }
                const d = destinosFiltrados.find(x => x.descripcion === descripcion);
                if (!d) { handleChange('destino', descripcion); return; }

                    ...prev,
                    destino: d.descripcion,
                    nroPlanta: d.codigoPlanta || '',
                    direccionDestino: d.direccion || '',
                    localidad: d.localidad || '',
                    provincia: d.provincia || '',
                    destinoCuit: d.cuit || ''
                }));
            };

                if (!form.producto) { e.preventDefault(); alert('Primero seleccioná el Producto de la carta de porte para poder elegir el destino.'); }

function App() {
  const [data, setData] = useState({}); // { id: registro }
  const [turnosEstado, setTurnosEstado] = useState('cargando');
  const [turnosError, setTurnosError] = useState('');
  const [clientes, setClientes] = useState([]); // [{cliente, cuit, repre}] leídos de Supabase

  };
  useEffect(() => { cargarDatosFormulario(); }, []);
  // Estado del modal de carga de cupos (se abre desde la selección de turnos rojos)
  const [cargaCupos, setCargaCupos] = useState(null); // null o { editData }
  const [tab, setTab] = useState('detalle');
  const [processing, setProcessing] = useState(false);
  const [lastUpdate, setLastUpdate] = useState(null);

  // Marca de última importación de STOP (tabla app_meta, compartida con Gestión).
  // Cuando cambia mientras la herramienta está abierta, mostramos un aviso sutil.
  const [stopActualizado, setStopActualizado] = useState(null);
  const [avisoActualizacion, setAvisoActualizacion] = useState(false);
  const stopActualizadoRef = useRef(null);
  const primeraCargaStopRef = useRef(true);
  const leerMarcaStop = async () => {
    try {
      const { data } = await sb.from('app_meta').select('value').eq('key', 'ultima_actualizacion_stop').maybeSingle();
      const val = data ? data.value : null;
      if (primeraCargaStopRef.current) {
        // primera lectura: solo guardamos, sin avisar
        primeraCargaStopRef.current = false;
        stopActualizadoRef.current = val;
        setStopActualizado(val);
      } else if (val && val !== stopActualizadoRef.current) {
        // cambió después de tener la herramienta abierta → avisar (sin pisar los datos aún)
        setAvisoActualizacion(true);
      }
    } catch(e) { console.error('Error leyendo marca STOP', e); }
  };
  useEffect(() => {
    leerMarcaStop();
    const ch = sb.channel('rt_app_meta')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'app_meta' }, () => leerMarcaStop())
      .subscribe();
    return () => { sb.removeChannel(ch); };
  }, []);
  // Al aceptar el aviso: recargamos turnos y asignados, y actualizamos la marca mostrada.
  const aceptarActualizacion = async () => {
    await Promise.all([cargarTurnos(), cargarAsignados(), cargarSupaLog()]);
    // releer la marca para dejarla como referencia nueva
    try {
      const { data } = await sb.from('app_meta').select('value').eq('key', 'ultima_actualizacion_stop').maybeSingle();
      const val = data ? data.value : null;
      stopActualizadoRef.current = val;
      setStopActualizado(val);
    } catch(e) {}
    setAvisoActualizacion(false);
  };
  const [showAbm, setShowAbm] = useState(false);
  const [showDiag, setShowDiag] = useState(false);
  const [supaLog, setSupaLog] = useState({ map:{}, totalAlfas:0, totalQuotas:0 });
  const [supaLogEstado, setSupaLogEstado] = useState('cargando');
  const [supaLogError, setSupaLogError] = useState('');
  const [logistica, setLogistica] = useState([]);
  const [logisticaEstado, setLogisticaEstado] = useState('cargando');
  const [logisticaActualizada, setLogisticaActualizada] = useState(null);
  const [logisticaError, setLogisticaError] = useState('');

  // Turnos: se leen de Supabase y se escuchan cambios en tiempo real.
  const cargarTurnos = async () => {
    setTurnosEstado('cargando'); setTurnosError('');
    try {
      const rows = await cargarTurnosSupabase();
      const obj = {};
      rows.forEach(r => { const t = rowToTurno(r); obj[t.id] = t; });
      setData(obj);
      setLastUpdate(new Date().toISOString());
      setTurnosEstado('ok');
    } catch(e) {
      console.error('Error cargando turnos de Supabase', e);
      setTurnosError(e.message || 'No se pudo leer turnos.');
      setTurnosEstado('error');
    }
  };
  useEffect(() => {
    cargarTurnos();
    const ch = sb.channel('rt_turnos_stop')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'turnos_stop' }, () => cargarTurnos())
      .subscribe();
    return () => { sb.removeChannel(ch); };
  }, []);

  // Asignados (grilla 3 de Gestión): mapa alfanumérico -> datos del cupo asignado.
  const [asignados, setAsignados] = useState({});
  const cargarAsignados = async () => {
    try {
      const rows = await cargarAsignadosSupabase();
      const m = {};
      rows.forEach(a => {
        const k = normClave(a.alfanumerico);
        if (k) m[k] = {
          cliente: a.client_name || '',
          producto: limpiarProducto(a.product || ''),
          destino: limpiarCuit(a.destino || ''),
          comprador: limpiarCuit(a.destinatario || a.batch_comprador || ''),
          fecha: parseFecha(a.date || ''),
          estado: a.estado_alfanumerico || ''
        };
      });
      setAsignados(m);
    } catch(e) { console.error('Error cargando asignados', e); }
  };
  useEffect(() => {
    cargarAsignados();
    const ch = sb.channel('rt_assigned_cliente')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'assigned_quotas' }, () => cargarAsignados())
      .subscribe();
    return () => { sb.removeChannel(ch); };
  }, []);

  // Clientes: se leen de Supabase (Gestión Logística) al abrir y con el botón de refresco.
  const cargarClientes = async () => {
    setClientesEstado('cargando'); setClientesError('');
    try {
      const lista = await cargarClientesSupabase();
      setClientes(lista);
      setClientesEstado('ok');
    } catch(e) {
      console.error('Error cargando clientes de Supabase', e);
      setClientesError(e.message || 'No se pudo leer la tabla de clientes.');
      setClientesEstado('error');
    }
  };
  useEffect(() => { cargarClientes(); }, []);

  const cargarSupaLog = async () => {
    setSupaLogEstado('cargando'); setSupaLogError('');
    try {
      const res = await cargarAlfasSupabase();
      setSupaLog(res);
      setSupaLogEstado('ok');
    } catch(e) {
      console.error('Error leyendo alfanuméricos de Supabase', e);
      setSupaLogError(e.message || 'No se pudo leer quota_alfanumericos.');
      setSupaLogEstado('error');
    }
  };
  useEffect(() => {
    cargarSupaLog();
    const ch = sb.channel('rt_disponibilidad')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'quota_alfanumericos' }, () => cargarSupaLog())
      .subscribe();
    return () => { sb.removeChannel(ch); };
  }, []);


  const refrescoEnCurso = useRef(false);
  // El setInterval captura la primera versión de refrescarLogistica (con logistica=[]).
  // Este ref siempre refleja la cantidad actual, así el chequeo posterior no queda obsoleto.
  const logisticaLenRef = useRef(0);
  useEffect(() => { logisticaLenRef.current = logistica.length; }, [logistica]);

  const refrescarLogistica = async (silencioso=false) => {
    // Evita consultas simultáneas si una respuesta de Apps Script viene lenta.
    if (refrescoEnCurso.current) return;
    refrescoEnCurso.current = true;
    if (!silencioso && logisticaLenRef.current === 0) setLogisticaEstado('cargando');
    setLogisticaError('');

    let ultimoError = null;
    // Reintento automático: ya no hace falta hacer clic cuando Apps Script falla transitoriamente.
    for (let intento = 1; intento <= 2; intento++) {
      try {
        const resp = await cargarLogisticaJSONP();
        if (!resp || resp.ok !== true || !Array.isArray(resp.registros)) {
          throw new Error((resp && resp.error) || 'Respuesta inválida de la API.');
        }
        const actualizado = resp.actualizado || new Date().toISOString();
        setLogistica(resp.registros);
        setLogisticaActualizada(actualizado);
        setLogisticaEstado('ok');
        try {
          localStorage.setItem(STORAGE_LOGISTICA, JSON.stringify({registros:resp.registros, actualizado}));
        } catch(e) { console.warn('No se pudo guardar caché de Logística', e); }
        refrescoEnCurso.current = false;
        return;
      } catch (err) {
        ultimoError = err;
        console.warn(`Intento ${intento}/2 de Logística falló`, err);
        if (intento < 2) await new Promise(r => setTimeout(r, 1500));
      }
    }

    // Si ya tenemos una copia válida, la conservamos y seguimos operando sin bloquear la herramienta.
    if (logisticaLenRef.current > 0) {
      setLogisticaEstado('ok');
      setLogisticaError('Actualización pendiente: se conserva la última copia válida.');
    } else {
      setLogisticaEstado('error');
      setLogisticaError((ultimoError && ultimoError.message) || 'No se pudo conectar con Logística.');
    }
    refrescoEnCurso.current = false;
  };

  useEffect(() => {
    // JSONP de Logística retirado (Etapa 2): el cruce ahora es 100% contra Supabase.
    setLogisticaEstado('ok');
  }, []);

  // Mapa CUIT -> repre para el cruce rápido
  const mapaRepre = useMemo(() => {
    const m = {};
    clientes.forEach(c => { const k = normCuit(c.cuit); if (k) m[k] = c.repre || ''; });
    return m;
  }, [clientes]);

  // Nombres canónicos de representantes/comerciales definidos en el ABM.
  const nombresRepreAbm = useMemo(() => [...new Set(clientes.map(c => (c.repre || '').trim()).filter(Boolean))], [clientes]);

  const [uploadProg, setUploadProg] = useState('');

  const handleUpload = async (e) => {
    const file = e.target.files[0];

    if (!file) return;
    setProcessing(true);
    setUploadProg('Leyendo Excel...');
    try {
      const buf = await file.arrayBuffer();
      const registros = parseExcel(buf);
      if (registros.length === 0) { alert('No se encontraron turnos en el archivo.'); setProcessing(false); setUploadProg(''); return; }
      await upsertTurnosSupabase(registros, (env, tot) => {
        setUploadProg(`Subiendo ${env} de ${tot}...`);
      });
      setUploadProg('Recargando...');
      let nuevos = 0, actualizados = 0;
      registros.forEach(reg => { if (data[reg.id]) actualizados++; else nuevos++; });
      await cargarTurnos();
      setUploadProg('');
      alert(`✅ Importación completa.\nNuevos: ${nuevos}\nActualizados: ${actualizados}\nTotal en sistema: ${Object.keys(data).length}`);
    } catch(err) {
      alert('Error al procesar el Excel: ' + err.message);
    } finally {
      setProcessing(false);
      setUploadProg('');

  };

  const borrarTodo = async () => {

      setData({});
      setLastUpdate(null);
    } catch(e) {
      alert('Error al borrar: ' + e.message);
    }
  };

  const mapaLogistica = useMemo(() => {
    const m = {};
    logistica.forEach(x => {
      // Intentamos por ambos campos: STOP y código de Logística.
      [x.stop, x.codigo].forEach(v => {
        const k = normClave(v);
        if (k && !m[k]) m[k] = x;
      });
    });
    return m;
  }, [logistica]);

  const registros = useMemo(() => {
    const dispMap = supaLog.map || {}; // alfanuméricos que están en Disponibilidad de Cupos
    const idsStop = new Set(Object.keys(data).map(id => normClave(id)));

    // 1) Turnos de STOP enriquecidos (solo fecha >= corte)
    const stopEnriquecidos = Object.values(data)
      .filter(r => !r.fecha || r.fecha >= FECHA_CORTE)
      .map(r => {
        const cuitRtte = normCuit(r.rtteComercialCuit);
        const cuitInter = normCuit(r.intermediarioCuit);
        const cuitOrigen = normCuit(r.origenCuit);
        const repreAbm = mapaRepre[cuitRtte] || mapaRepre[cuitInter] || mapaRepre[cuitOrigen] || '';
        const enDisponibilidad = !!dispMap[normClave(r.id)];
        const asig = asignados[normClave(r.id)];
        // Semáforo:
        // rojo = turno en STOP que NO está en Disponibilidad de Cupos (hay que cargarlo)
        // (sin color) = turno en STOP que ya está en Disponibilidad
        const semaforo = enDisponibilidad ? '' : 'rojo';
        return {
          ...r,
          clienteAsignado: asig ? asig.cliente : '',
          enDisponibilidad,
          repre: repreAbm,
          semaforo,
          fuente: 'stop'
        };
      });

    // 2) Cupos asignados (grilla 3) que NO aparecen en el STOP → punto negro (solo fecha >= corte)
    const soloAsignados = Object.entries(asignados)
      .filter(([alfa, a]) => !idsStop.has(alfa) && (!a.fecha || a.fecha >= FECHA_CORTE))

        repre: '',
        semaforo: 'negro',
        fuente: 'asignado'
      }));

    return [...stopEnriquecidos, ...soloAsignados];
  }, [data, mapaRepre, asignados, supaLog]);

  // Abre la carga de cupos hacia Disponibilidad con los turnos seleccionados.
  const abrirCargaCupos = (ids, onDone) => {

    const editData = {

        localidad: r0.localidadDestino || '', provincia: '', observaciones: ''
      },
      alfanumericos: sel.map(r => r.id),
      _desdeAnalisis: true
    };
    setCargaCupos({ editData, onDone });
  };

  // Guarda los cupos en Disponibilidad (buyer_quotas + quota_alfanumericos). Opción A: siempre lote nuevo.
  const guardarCuposEnDisponibilidad = async (batchData) => {
    try {
      const payload = {
        fecha_cupo: batchData.fechaCupo || null,
        producto: batchData.producto,
        comprador: limpiarCuit(batchData.comprador),

        condicion: 'C/Descarga',
        comp_vend_a3: limpiarCuit(batchData.mercadoTermino),
        observaciones: batchData.observaciones,
        full_cp_data: batchData
      };
      const { data, error: e1 } = await sb.from('buyer_quotas').insert(payload).select().single();
      if (e1) throw e1;
      const quotaId = data.id;

      if (batchData.alfanumericosList && batchData.alfanumericosList.length > 0) {
        const { data: existing } = await sb.from('quota_alfanumericos').select('code').eq('buyer_quota_id', quotaId);
        const existingCodes = new Set((existing || []).map(a => a.code));
        const toInsert = batchData.alfanumericosList
          .filter(c => !existingCodes.has(c))
          .map(c => ({ buyer_quota_id: quotaId, code: c, status: 'disponible' }));
        if (toInsert.length > 0) {
          const { error: e2 } = await sb.from('quota_alfanumericos').insert(toInsert);
          if (e2) throw e2;
        }
      }

      const onDone = cargaCupos && cargaCupos.onDone;
      setCargaCupos(null);
      if (onDone) onDone();
      await cargarSupaLog(); // refrescar qué alfanuméricos están en Disponibilidad (actualiza puntos rojos)
      alert(`✅ Cupos agregados a Disponibilidad.\n\n• Lote creado para ${payload.producto} — ${payload.destinatario}\n• Alfanuméricos cargados: ${(batchData.alfanumericosList||[]).length}`);
    } catch (e) {
      alert('Error al guardar en Disponibilidad: ' + e.message);
    }
  };

  return (

// ==================== DIAGNÓSTICO 3b: JSONP vs SUPABASE ====================
// Compara, sobre los turnos SIN CTG (los que dependen del cruce con Logística),
// cuántos matchean en la fuente actual (JSONP) y cuántos en Supabase.
// El objetivo es confirmar que Supabase cubre todo ANTES de sacar el JSONP.
function DiagLogistica({ registros, logisticaMap, logisticaCount, supaLog, estado, error, onRefresh, onClose }) {
  const stats = useMemo(() => {
    const sinctg = registros.filter(r => esIncumplido(r.estado));
    let ambos=0, soloJsonp=0, soloSupa=0, ninguno=0;
    const listaSoloJsonp=[], listaSoloSupa=[], muestraMatch=[];
    sinctg.forEach(r => {
      const k = normClave(r.id);
      const j = logisticaMap[k] || null;
      const s = supaLog.map[k] || null;
      if (j && s) { ambos++; if (muestraMatch.length<20) muestraMatch.push({r,j,s}); }
      else if (j && !s) { soloJsonp++; if (listaSoloJsonp.length<25) listaSoloJsonp.push(r.id); }
      else if (!j && s) { soloSupa++; if (listaSoloSupa.length<25) listaSoloSupa.push(r.id); }
      else ninguno++;
    });
    return { totalSinctg:sinctg.length, matchJsonp:ambos+soloJsonp, matchSupa:ambos+soloSupa, ambos, soloJsonp, soloSupa, ninguno, listaSoloJsonp, listaSoloSupa, muestraMatch };
  }, [registros, logisticaMap, supaLog]);

  const Card = ({label, val, cls}) => (
    <div className={`rounded-lg border p-3 text-center ${cls}`}>
      <div className="text-2xl font-black">{val}</div>
      <div className="text-[10px] font-bold uppercase tracking-wide opacity-80">{label}</div>
    </div>
  );

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50" onClick={onClose}>
      <div className="bg-white rounded-xl shadow-2xl w-full max-w-5xl max-h-[92vh] flex flex-col" onClick={e=>e.stopPropagation()}>
        <div className="bg-indigo-800 text-white px-4 py-3 rounded-t-xl flex justify-between items-center">
          <h3 className="font-bold flex items-center gap-2"><IconGrid className="w-5 h-5"/> Diagnóstico cruce SIN CTG · JSONP vs Supabase</h3>
          <button onClick={onClose} className="hover:bg-white/20 p-1 rounded"><IconX className="w-5 h-5"/></button>
        </div>

        <div className="px-4 py-2 border-b border-slate-100 flex items-center gap-3 flex-wrap text-[11px]">
          <span className="text-slate-600">JSONP cargó <b>{logisticaCount}</b> registros · Supabase cargó <b>{supaLog.totalAlfas}</b> alfanuméricos / <b>{supaLog.totalQuotas}</b> cupos</span>
          <button onClick={onRefresh} disabled={estado==='cargando'} className="ml-auto text-xs font-bold text-indigo-700 border border-indigo-300 rounded px-3 py-1.5 hover:bg-indigo-50 disabled:opacity-50">
            {estado==='cargando' ? 'Leyendo Supabase...' : 'Releer Supabase'}
          </button>
          <span className={`text-[11px] font-bold px-2 py-1 rounded ${estado==='ok'?'bg-emerald-100 text-emerald-700':estado==='error'?'bg-red-100 text-red-700':'bg-amber-100 text-amber-700'}`}>
            {estado==='ok' ? '● Supabase OK' : estado==='error' ? '● Error' : '● Leyendo...'}
          </span>
        </div>
        {estado==='error' && <div className="px-4 py-2 text-xs text-red-600 bg-red-50 border-b border-red-100">{error}</div>}

        <div className="flex-1 overflow-auto custom-scroll p-4 space-y-4">
          <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
            <Card label="SIN CTG totales" val={stats.totalSinctg} cls="bg-slate-50 border-slate-200 text-slate-700"/>
            <Card label="Matchean en JSONP" val={stats.matchJsonp} cls="bg-emerald-50 border-emerald-200 text-emerald-700"/>
            <Card label="Matchean en Supabase" val={stats.matchSupa} cls="bg-indigo-50 border-indigo-200 text-indigo-700"/>
            <Card label="En NINGUNA fuente" val={stats.ninguno} cls="bg-slate-50 border-slate-200 text-slate-400"/>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-3 gap-2">
            <Card label="En ambas" val={stats.ambos} cls="bg-emerald-50 border-emerald-200 text-emerald-700"/>
            <Card label="Solo JSONP (se perderían)" val={stats.soloJsonp} cls={stats.soloJsonp>0?"bg-red-50 border-red-300 text-red-700":"bg-slate-50 border-slate-200 text-slate-400"}/>
            <Card label="Solo Supabase (ganaríamos)" val={stats.soloSupa} cls="bg-blue-50 border-blue-200 text-blue-700"/>
          </div>

          <div className="text-[11px] text-slate-500 bg-amber-50 border border-amber-200 rounded p-2">
            <b>Cómo leerlo:</b> si "Solo JSONP" es <b>0</b>, Supabase cubre todo lo que hoy cubre el JSONP y es seguro sacarlo.
            Si es mayor a 0, esos alfanuméricos existen en la fuente vieja pero no en Supabase (formato distinto o no cargados) y los perderíamos.
          </div>

          {stats.soloJsonp>0 && (
            <div>
              <div className="text-xs font-bold text-red-700 mb-1">Alfanuméricos que matchean SOLO en JSONP (muestra):</div>
              <div className="flex flex-wrap gap-1">
                {stats.listaSoloJsonp.map((id,i)=><span key={i} className="font-mono text-[10px] bg-red-100 text-red-700 px-1.5 py-0.5 rounded">{id}</span>)}
              </div>
            </div>
          )}

          <div>
            <div className="text-xs font-bold text-slate-700 mb-1">Muestra de coincidencias — comparar campos JSONP vs Supabase para definir el mapeo:</div>
            <div className="overflow-auto border border-slate-200 rounded">
              <table className="w-full text-left text-[11px] border-collapse">
                <thead className="bg-slate-100"><tr>{['Alfanumérico','JSONP cliente','JSONP repreCom','SUPA comprador','SUPA rte_prim','SUPA rte_sec','SUPA destinatario'].map(h=><th key={h} className="p-1.5 font-bold text-slate-600 border-b border-slate-200 whitespace-nowrap">{h}</th>)}</tr></thead>
                <tbody>
                  {stats.muestraMatch.map(({r,j,s},i)=>(
                    <tr key={i} className="even:bg-slate-50">
                      <td className="p-1.5 border-b border-slate-100 font-mono font-bold">{r.id}</td>
                      <td className="p-1.5 border-b border-slate-100">{j.cliente||'—'}</td>
                      <td className="p-1.5 border-b border-slate-100 text-emerald-700 font-bold">{j.repreCom||'—'}</td>
                      <td className="p-1.5 border-b border-slate-100">{s.quota?(s.quota.comprador||'—'):'(sin cupo)'}</td>
                      <td className="p-1.5 border-b border-slate-100 text-indigo-700 font-bold">{s.quota?(s.quota.rte_comercial_primaria||'—'):'—'}</td>
                      <td className="p-1.5 border-b border-slate-100 text-indigo-700">{s.quota?(s.quota.rte_comercial_secundaria||'—'):'—'}</td>
                      <td className="p-1.5 border-b border-slate-100">{s.quota?(s.quota.destinatario||'—'):'—'}</td>
                    </tr>
                  ))}
                  {stats.muestraMatch.length===0 && <tr><td colSpan="7" className="p-6 text-center text-slate-400 italic">No hay coincidencias en ambas fuentes todavía (subí un STOP y esperá que cargue Supabase).</td></tr>}
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <div className="p-3 border-t border-slate-200 flex justify-end gap-2 bg-slate-50 rounded-b-xl">
          <button onClick={onClose} className="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold px-5 py-2 rounded-lg">Cerrar</button>
        </div>
      </div>
    </div>
  );
}

// ==================== TAB DETALLE ====================
function DetalleTab({ registros, abrirCargaCupos }) {
  const [fDesde, setFDesde] = useState('');
  const [fHasta, setFHasta] = useState('');
  const [fDia, setFDia] = useState(() => isoDeDate(new Date()));
  const [fProducto, setFProducto] = useState('');
  const [fDestino, setFDestino] = useState('');
  const [fRepre, setFRepre] = useState('');
  const [fOrigen, setFOrigen] = useState('');
  const [fInter, setFInter] = useState('');
  const [fClienteLog, setFClienteLog] = useState('');
  const [fEstado, setFEstado] = useState('');
  const [fSemaforo, setFSemaforo] = useState(new Set(['normal','rojo','negro']));
  const [showSemaforoMenu, setShowSemaforoMenu] = useState(false);
  const toggleSemaforo = (color) => setFSemaforo(prev => {
    const next = new Set(prev);
    next.has(color) ? next.delete(color) : next.add(color);
    return next;
  });
  const [fCumplimiento, setFCumplimiento] = useState('');
  const [sortCol, setSortCol] = useState('fecha');
  const [sortDir, setSortDir] = useState('asc'); // 'asc' o 'desc'

  // Selección de turnos con punto rojo para cargarlos a Disponibilidad de Cupos
  const [seleccion, setSeleccion] = useState(new Set()); // set de ids seleccionados
  // Clave de coincidencia: producto + destinatario + destino + fecha
  const claveCoincidencia = (r) => [r.producto, r.comprador, r.destino, r.localidadDestino, r.fecha].map(x => (x||'').toString().trim().toUpperCase()).join('||');
  // Cuando hay selección, calculamos la clave de referencia (la del primer seleccionado)
  const clavesSeleccionadas = useMemo(() => {
    const s = new Set();
    registros.forEach(r => { if (seleccion.has(r.id)) s.add(claveCoincidencia(r)); });
    return s;
  }, [seleccion, registros]);
  const toggleSeleccion = (id) => setSeleccion(prev => {
    const next = new Set(prev);
    next.has(id) ? next.delete(id) : next.add(id);
    return next;
  });
  const limpiarSeleccion = () => setSeleccion(new Set());

  const toggleSort = (col) => {
    if (sortCol === col) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortCol(col); setSortDir('asc'); }
  };

  const productos = useMemo(() => [...new Set(registros.map(r=>r.producto).filter(Boolean))].sort(), [registros]);
  const destinos = useMemo(() => [...new Set(registros.map(r=>r.destino).filter(Boolean))].sort(), [registros]);
  const repres = useMemo(() => [...new Set(registros.map(r=>r.repre).filter(Boolean))].sort(), [registros]);
  const origenes = useMemo(() => [...new Set(registros.map(r=>r.origen).filter(Boolean))].sort(), [registros]);
  const intermediarios = useMemo(() => [...new Set(registros.map(r=>r.intermediario).filter(Boolean))].sort(), [registros]);
  const clientesLog = useMemo(() => [...new Set(registros.map(r=>r.clienteAsignado).filter(Boolean))].sort(), [registros]);
  const estados = useMemo(() => [...new Set(registros.map(r=>r.estado).filter(Boolean))].sort(), [registros]);

  const filtradosBase = useMemo(() => {
    return registros.filter(r => {
      if (fDia && r.fecha !== fDia) return false;
      if (fDesde && (!r.fecha || r.fecha < fDesde)) return false;
      if (fHasta && (!r.fecha || r.fecha > fHasta)) return false;
      if (fProducto && r.producto !== fProducto) return false;
      if (fDestino && r.destino !== fDestino) return false;
      if (fRepre && r.repre !== fRepre) return false;
      if (fOrigen && r.origen !== fOrigen) return false;
      if (fInter && r.intermediario !== fInter) return false;
      if (fClienteLog && r.clienteAsignado !== fClienteLog) return false;
      if (fEstado && r.estado !== fEstado) return false;
      if (!fSemaforo.has(r.semaforo || 'normal')) return false;
      return true;
    });
  }, [registros, fDia, fDesde, fHasta, fProducto, fDestino, fRepre, fOrigen, fInter, fClienteLog, fEstado, fSemaforo]);

  const totCumplidos = filtradosBase.filter(r=>!esIncumplido(r.estado)).length;
  const totIncumplidos = filtradosBase.length - totCumplidos;

  const filtrados = useMemo(() => {
    const base = filtradosBase.filter(r => {
      if (fCumplimiento === 'cumplidos') return !esIncumplido(r.estado);
      if (fCumplimiento === 'incumplidos') return esIncumplido(r.estado);
      return true;
    });
    const colMap = {
      fecha:'fecha', alfa:'id', estado:'estado', prod:'producto',
      cli:'clienteAsignado', repre:'repre', origen:'origen',
      inter:'intermediario', rtte:'rtteComercial', destino:'destino',
      loc:'localidadDestino', destinatario:'comprador', ctg:'ctg'
    };
    const key = colMap[sortCol] || 'fecha';
    const dir = sortDir === 'desc' ? -1 : 1;
    return base.sort((a,b) => {
      const va = (a[key]||'').toString().toLowerCase();
      const vb = (b[key]||'').toString().toLowerCase();
      return va < vb ? -dir : va > vb ? dir : 0;
    });
  }, [filtradosBase, fCumplimiento, sortCol, sortDir]);

  const limpiar = () => { setFDesde(''); setFHasta(''); setFDia(''); setFProducto(''); setFDestino(''); setFRepre(''); setFOrigen(''); setFInter(''); setFClienteLog(''); setFEstado(''); setFSemaforo(new Set(['verde','rojo','violeta','negro','gris'])); setShowSemaforoMenu(false); setFCumplimiento(''); };

  const selCls = "p-1 border border-slate-300 rounded text-[11px] outline-none focus:border-emerald-500 bg-white max-w-[130px]";
  const dateCls = "p-1 border border-slate-300 rounded text-[11px] outline-none focus:border-emerald-500 bg-white";
  const lbl = "text-[9px] font-bold text-slate-500 uppercase block mb-0.5";

  return (
    <div className="h-full flex flex-col gap-3">
      {/* FILTROS */}
      <div className="bg-white rounded-lg border border-slate-200 p-2 shrink-0">
        <div className="flex flex-wrap gap-2 items-end">
          <div>
            <label className={lbl}>Día</label>
            <input type="date" value={fDia} onChange={e=>{setFDia(e.target.value); setFDesde(''); setFHasta('');}} className={dateCls}/>
          </div>
          <div className="text-slate-300 pb-1 font-bold text-xs">ó</div>
          <div>
            <label className={lbl}>Desde</label>
            <input type="date" value={fDesde} onChange={e=>{setFDesde(e.target.value); setFDia('');}} className={dateCls}/>
          </div>
          <div>

// ==================== TAB SEMANAL ====================
function SemanalTab({ registros }) {
  const [fProducto, setFProducto] = useState('');
  const [fRepre, setFRepre] = useState('');
  const [lunesRef, setLunesRef] = useState(() => getLunes(new Date()));

  const productos = useMemo(() => [...new Set(registros.map(r=>r.producto).filter(Boolean))].sort(), [registros]);
  const repres = useMemo(() => [...new Set(registros.map(r=>r.repre).filter(Boolean))].sort(), [registros]);

  // Registros filtrados por producto y repre
  const regs = useMemo(() => registros.filter(r =>
    (!fProducto || r.producto===fProducto) && (!fRepre || r.repre===fRepre)
  ), [registros, fProducto, fRepre]);

  // Los 7 días de la semana visible (ISO)
  const diasSemana = useMemo(() => {
    return Array.from({length:7}, (_,i) => {
      const d = new Date(lunesRef);
      d.setDate(d.getDate()+i);
      return { iso: isoDeDate(d), dia: d.getDate(), mes: d.getMonth(), anio: d.getFullYear() };
    });
  }, [lunesRef]);

  const isoSemana = useMemo(() => new Set(diasSemana.map(d=>d.iso)), [diasSemana]);

  // Compradores que tienen algún turno en la semana visible
  const compradores = useMemo(() => {
    const set = new Set();
    regs.forEach(r => {
      if (!r.fecha || !isoSemana.has(r.fecha)) return;
      set.add(r.comprador || 'SIN DESTINATARIO');
    });
    return [...set].sort((a,b) => {
      if (a === 'SIN DESTINATARIO') return 1;
      if (b === 'SIN DESTINATARIO') return -1;
      return a.localeCompare(b);
    });
  }, [regs, isoSemana]);

  // Matriz: comprador -> iso -> {total, cumplidos, incumplidos}
  const matriz = useMemo(() => {
    const m = {};
    compradores.forEach(c => { m[c] = {}; diasSemana.forEach(d => m[c][d.iso] = {total:0,cump:0,incump:0}); });
    regs.forEach(r => {
      if (!r.fecha || !isoSemana.has(r.fecha)) return;
      const comprador = r.comprador || 'SIN DESTINATARIO';
      if (!m[comprador]) return;
      const cell = m[comprador][r.fecha];
      cell.total++;
      if (esIncumplido(r.estado)) cell.incump++; else cell.cump++;
    });
    return m;
  }, [regs, compradores, diasSemana, isoSemana]);

  // Totales por columna (día) y fila (comprador)
  const totalCol = (iso) => {
    let t=0,c=0,i=0;
    compradores.forEach(comp => { const cell=matriz[comp][iso]; t+=cell.total; c+=cell.cump; i+=cell.incump; });
    return {total:t,cump:c,incump:i};
  };
  const totalFila = (comp) => {
    let t=0,c=0,i=0;
    diasSemana.forEach(d => { const cell=matriz[comp][d.iso]; t+=cell.total; c+=cell.cump; i+=cell.incump; });
    return {total:t,cump:c,incump:i};
  };
  const totalGeneral = () => {
    let t=0,c=0,i=0;
    compradores.forEach(comp => diasSemana.forEach(d => { const cell=matriz[comp][d.iso]; t+=cell.total; c+=cell.cump; i+=cell.incump; }));
    return {total:t,cump:c,incump:i};
  };

  // Título del mes/año visible (si la semana cruza dos meses, muestra ambos)
  const tituloMes = useMemo(() => {
    const meses = [...new Set(diasSemana.map(d=>`${MESES[d.mes]} ${d.anio}`))];
    return meses.join(' / ');
  }, [diasSemana]);

  const irSemana = (delta) => {
    const d = new Date(lunesRef);
    d.setDate(d.getDate() + delta*7);
    setLunesRef(getLunes(d));
  };
  const hoy = () => setLunesRef(getLunes(new Date()));

  const Celda = ({data}) => {
    if (!data || data.total===0) return <div className="text-slate-300 text-center">-</div>;
    return (
      <div className="flex items-center justify-center whitespace-nowrap leading-none text-xs">
        <span className="font-black text-slate-800">{data.total}</span>
        <span className="text-slate-400 mx-1">/</span>
        <span className="font-bold text-red-600">{data.incump}</span>
        <span className="text-[10px] font-medium text-red-500 ml-1">{((data.incump / data.total) * 100).toLocaleString('es-AR', {minimumFractionDigits:1, maximumFractionDigits:1})}%</span>
      </div>
    );
  };

  return (
    <div className="h-full flex flex-col gap-3">
      {/* CONTROLES */}
      <div className="bg-white rounded-lg border border-slate-200 p-3 shrink-0 flex items-center justify-between flex-wrap gap-3">
        <div className="flex items-center gap-2">
          <button onClick={()=>irSemana(-1)} className="p-1.5 rounded-lg border border-slate-300 hover:bg-slate-100 transition"><IconLeft className="w-4 h-4"/></button>
          <div className="text-center min-w-[180px]">
            <div className="text-xs font-bold text-slate-400 uppercase">{tituloMes}</div>
            <div className="text-sm font-black text-slate-700">{fechaDisplay(diasSemana[0].iso)} — {fechaDisplay(diasSemana[6].iso)}</div>
          </div>
          <button onClick={()=>irSemana(1)} className="p-1.5 rounded-lg border border-slate-300 hover:bg-slate-100 transition"><IconRight className="w-4 h-4"/></button>
          <button onClick={hoy} className="text-xs font-bold text-emerald-700 border border-emerald-300 rounded px-3 py-1.5 hover:bg-emerald-50 ml-2">Hoy</button>
        </div>
        <div className="flex items-center gap-3">
          <div>
            <label className="text-[10px] font-bold text-slate-500 uppercase mr-2">Producto</label>
            <select value={fProducto} onChange={e=>setFProducto(e.target.value)} className="p-1.5 border border-slate-300 rounded text-xs outline-none focus:border-emerald-500 bg-white"><option value="">Todos</option>{productos.map(p=><option key={p} value={p}>{p}</option>)}</select>
          </div>
          <div>
            <label className="text-[10px] font-bold text-slate-500 uppercase mr-2">Repre/Comercial</label>
            <select value={fRepre} onChange={e=>setFRepre(e.target.value)} className="p-1.5 border border-slate-300 rounded text-xs outline-none focus:border-emerald-500 bg-white"><option value="">Todos</option>{repres.map(r=><option key={r} value={r}>{r}</option>)}</select>
          </div>
        </div>
      </div>

      {/* GRILLA SEMANAL */}
      <div className="flex-1 overflow-auto custom-scroll bg-white rounded-lg border border-slate-200">
        <table className="w-full border-collapse text-xs">
          <thead className="sticky top-0 z-10">
            <tr className="bg-slate-700 text-white">
              <th className="p-2 text-left font-bold sticky left-0 bg-slate-700 z-20 min-w-[150px]">Comprador</th>
              {diasSemana.map((d,i)=>(
                <th key={d.iso} className="p-2 text-center font-bold border-l border-slate-600 min-w-[72px]">
                  <div>{DIAS_SEMANA[i]}</div>
                  <div className="text-[11px] text-slate-300 font-black">{d.dia}</div>
                </th>
              ))}
              <th className="p-2 text-center font-bold border-l-2 border-slate-500 bg-slate-800 min-w-[72px]">TOTAL</th>
            </tr>
          </thead>
          <tbody>
            {compradores.map(comp => {
              const tf = totalFila(comp);
              return (
                <tr key={comp} className="hover:bg-emerald-50/40 transition">
                  <td className="p-2 font-bold text-slate-700 border-b border-slate-100 sticky left-0 bg-white z-10 max-w-[170px] truncate" title={comp}>{comp}</td>
                  {diasSemana.map(d => (
                    <td key={d.iso} className="p-1.5 border-b border-l border-slate-100 align-middle"><Celda data={matriz[comp][d.iso]}/></td>
                  ))}
                  <td className="p-1.5 border-b border-l-2 border-slate-300 bg-slate-50 align-middle"><Celda data={tf}/></td>
                </tr>
              );
            })}
            {compradores.length===0 && <tr><td colSpan="9" className="p-8 text-center text-slate-400 italic">No hay turnos en esta semana{fProducto?` para ${fProducto}`:''}.</td></tr>}
          </tbody>
          {compradores.length>0 && (
            <tfoot className="sticky bottom-0 z-10">
              <tr className="bg-slate-200 font-bold">
                <td className="p-2 text-slate-800 sticky left-0 bg-slate-200 z-10">TOTAL</td>
                {diasSemana.map(d => (
                  <td key={d.iso} className="p-1.5 border-l border-slate-300 align-middle"><Celda data={totalCol(d.iso)}/></td>
                ))}
                <td className="p-1.5 border-l-2 border-slate-400 bg-slate-300 align-middle"><Celda data={totalGeneral()}/></td>
              </tr>
            </tfoot>
          )}
        </table>
      </div>
    </div>
  );
}

      <span className="font-black text-slate-800">{data.total}</span>
      <span className="text-slate-400 mx-1">/</span>
      <span className="font-bold text-red-600">{data.incump}</span>
        <span className="text-[10px] font-medium text-red-500 ml-1">{((data.incump / data.total) * 100).toLocaleString('es-AR', {minimumFractionDigits:1, maximumFractionDigits:1})}%</span>
    </div>
  );

  return (
    <div className="h-full flex flex-col gap-3">
      <div className="bg-white rounded-lg border border-slate-200 p-3 shrink-0 flex items-center justify-between flex-wrap gap-3">
        <div className="flex items-center gap-2">
          <button onClick={()=>irSemana(-1)} className="p-1.5 rounded-lg border border-slate-300 hover:bg-slate-100 transition"><IconLeft className="w-4 h-4"/></button>
          <div className="text-center min-w-[180px]"><div className="text-xs font-bold text-slate-400 uppercase">{tituloMes}</div><div className="text-sm font-black text-slate-700">{fechaDisplay(diasSemana[0].iso)} — {fechaDisplay(diasSemana[6].iso)}</div></div>
          <button onClick={()=>irSemana(1)} className="p-1.5 rounded-lg border border-slate-300 hover:bg-slate-100 transition"><IconRight className="w-4 h-4"/></button>
          <button onClick={hoy} className="text-xs font-bold text-emerald-700 border border-emerald-300 rounded px-3 py-1.5 hover:bg-emerald-50 ml-2">Hoy</button>
        </div>
        <div className="flex items-center gap-3">
          <div><label className="text-[10px] font-bold text-slate-500 uppercase mr-2">Producto</label><select value={fProducto} onChange={e=>setFProducto(e.target.value)} className="p-1.5 border border-slate-300 rounded text-xs outline-none focus:border-emerald-500 bg-white"><option value="">Todos</option>{productos.map(p=><option key={p} value={p}>{p}</option>)}</select></div>
          <div><label className="text-[10px] font-bold text-slate-500 uppercase mr-2">Comprador</label><select value={fComprador} onChange={e=>setFComprador(e.target.value)} className="p-1.5 border border-slate-300 rounded text-xs outline-none focus:border-emerald-500 bg-white"><option value="">Todos</option>{compradoresFiltro.map(x=><option key={x} value={x}>{x}</option>)}</select></div>
        </div>
      </div>
      <div className="flex-1 overflow-auto custom-scroll bg-white rounded-lg border border-slate-200">
        <table className="w-full border-collapse text-xs">
          <thead className="sticky top-0 z-10"><tr className="bg-slate-700 text-white">
            <th className="p-2 text-left font-bold sticky left-0 bg-slate-700 z-20 min-w-[150px]">Repre/Comercial</th>
            {diasSemana.map((d,i)=><th key={d.iso} className="p-2 text-center font-bold border-l border-slate-600 min-w-[72px]"><div>{DIAS_SEMANA[i]}</div><div className="text-[11px] text-slate-300 font-black">{d.dia}</div></th>)}
            <th className="p-2 text-center font-bold border-l-2 border-slate-500 bg-slate-800 min-w-[72px]">TOTAL</th>
          </tr></thead>
          <tbody>
            {repres.map(rep=><tr key={rep} className="hover:bg-emerald-50/40 transition">
              <td className="p-2 font-bold text-slate-700 border-b border-slate-100 sticky left-0 bg-white z-10 max-w-[170px] truncate" title={rep}>{rep}</td>
              {diasSemana.map(d=><td key={d.iso} className="p-1 border-b border-l border-slate-100 align-middle"><Celda data={matriz[rep][d.iso]}/></td>)}
              <td className="p-1 border-b border-l-2 border-slate-300 bg-slate-50 align-middle"><Celda data={totalFila(rep)}/></td>
            </tr>)}
            {repres.length===0 && <tr><td colSpan="9" className="p-8 text-center text-slate-400 italic">No hay turnos en esta semana.</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
